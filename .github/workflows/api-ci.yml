name: API CI
on:
  push:
    paths:
      - 'packages/api/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/api-ci.yml'
  pull_request:
    paths:
      - 'packages/api/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/api-ci.yml'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://entrip:entrip_ci_test@localhost:5432/entrip_test
      TEST_DATABASE_URL: postgresql://entrip:entrip_ci_test@localhost:5432/entrip_test
      JWT_SECRET: ci-only-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-only-refresh-secret-at-least-32-characters
      CACHE_DISABLE_IN_TEST: 'true'
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: entrip
          POSTGRES_PASSWORD: entrip_ci_test
          POSTGRES_DB: entrip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U entrip -d entrip_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Activate the pinned repository package manager
        run: corepack enable && corepack prepare pnpm@10.13.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Apply reviewed v2 migrations to the dedicated test database
        run: pnpm exec prisma migrate deploy --schema packages/api/prisma/schema.prisma
      - name: Verify migrated models
        run: node scripts/verification/verify-v2-schema.mjs
      - name: Build API
        run: pnpm --filter @entrip/api build
      - name: Test API with coverage
        run: pnpm --filter @entrip/api test:coverage --runInBand
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          flags: api
          directory: ./packages/api/coverage
          token: ${{ secrets.CODECOV_TOKEN }}
