name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'pnpm'
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: latest
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Verify v2 cutover config
      run: pnpm run verify:v2-cutover

    - name: Verify v2 schema (schema-only)
      run: pnpm run verify:schema:v2

    - name: Run web v2 proxy contract tests
      run: pnpm --filter @entrip/web test -- app/api/v2 app/api/auth

    - name: Run web bookings proxy v2 mapping tests
      run: pnpm --filter @entrip/web test -- route.v2-mapping.test.ts
      
    - name: Build design tokens
      run: pnpm run build:tokens
      
    - name: TypeScript type check (strict mode)
      run: pnpm run ci:type-check
      
    - name: Lint check
      run: pnpm run lint:ci
      
    - name: Build project
      run: pnpm run build:strict

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'pnpm'
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: latest
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Verify v2 cutover config
      run: pnpm run verify:v2-cutover

    - name: Verify v2 schema (schema-only)
      run: pnpm run verify:schema:v2

    - name: Run web v2 proxy contract tests
      run: pnpm --filter @entrip/web test -- app/api/v2 app/api/auth

    - name: Run web bookings proxy v2 mapping tests
      run: pnpm --filter @entrip/web test -- route.v2-mapping.test.ts

    - name: Run tests
      run: pnpm run test:coverage

    - name: Upload cutover diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: cutover-diagnostics
        path: |
          scripts/verify-v2-cutover.mjs
          scripts/verify-v2-schema.mjs
          scripts/smoke-v2-endpoints.mjs
          docker-compose.dev.yml
          docker-compose.prod.yml
