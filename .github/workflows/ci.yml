name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'pnpm'
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: latest
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Cutover gate ownership
      run: echo "v2 cutover required checks are enforced in .github/workflows/v2-cutover-gates.yml"

    - name: Build design tokens
      run: pnpm run build:tokens
      
    - name: TypeScript type check (strict mode)
      run: pnpm run ci:type-check
      
    - name: Lint check
      run: pnpm run lint:ci
      
    - name: Build project
      run: pnpm run build:strict

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'pnpm'
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: latest
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Cutover gate ownership
      run: echo "v2 cutover required checks are enforced in .github/workflows/v2-cutover-gates.yml"

    - name: Run tests
      run: pnpm run test:coverage

    - name: Upload cutover diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: cutover-diagnostics
        path: |
          scripts/verify-v2-cutover.mjs
          scripts/verify-v2-schema.mjs
          scripts/smoke-v2-endpoints.mjs
          docker-compose.dev.yml
          docker-compose.prod.yml
