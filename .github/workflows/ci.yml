name: CI

on:
  push:
    branches: [ main, develop, b ]
  pull_request:
    branches: [ main, develop, b ]

jobs:
  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 10.13.1
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Cutover gate ownership
      run: echo "v2 cutover required checks are enforced in .github/workflows/v2-cutover-gates.yml"

    - name: Build design tokens
      run: pnpm run build:tokens
      
    - name: TypeScript type check (strict mode)
      run: pnpm run ci:type-check
      
    - name: Lint check
      run: pnpm run lint:ci
      
    - name: Build project
      run: pnpm run build:strict

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://entrip:entrip_ci_test@localhost:5432/entrip_test
      TEST_DATABASE_URL: postgresql://entrip:entrip_ci_test@localhost:5432/entrip_test
      JWT_SECRET: ci-only-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-only-refresh-secret-at-least-32-characters
      CACHE_DISABLE_IN_TEST: 'true'
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: entrip
          POSTGRES_PASSWORD: entrip_ci_test
          POSTGRES_DB: entrip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U entrip -d entrip_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 10.13.1
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Cutover gate ownership
      run: echo "v2 cutover required checks are enforced in .github/workflows/v2-cutover-gates.yml"

    - name: Apply reviewed migrations to the dedicated test database
      run: pnpm exec prisma migrate deploy --schema packages/api/prisma/schema.prisma

    - name: Verify all v2 models on the migrated test database
      run: node scripts/verification/verify-v2-schema.mjs

    - name: Build design tokens
      run: pnpm run build:tokens

    - name: Run all projects with coverage, sequentially
      # API suites clean only *_test databases; serialize suites sharing this database.
      # Keep existing coverage thresholds and reporters; do not combine --runInBand with --maxWorkers.
      run: pnpm exec jest --config jest.config.js --coverage --coverageReporters=text-summary --coverageReporters=json-summary --runInBand --detectOpenHandles

    - name: Upload cutover diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: cutover-diagnostics
        path: |
          scripts/verify-v2-cutover.mjs
          scripts/verify-v2-schema.mjs
          scripts/verification/verify-v2-schema.mjs
          docs/verification/2026-11-17/migration-verification.json
          scripts/smoke-v2-endpoints.mjs
          docker-compose.dev.yml
          docker-compose.prod.yml

