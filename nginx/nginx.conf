user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;
    gzip on;
    gzip_types application/json application/javascript text/css;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    # The external TLS terminator must overwrite this header. The compose
    # listener binds to loopback by default and is not an HTTPS endpoint.
    map $http_x_forwarded_proto $forwarded_proto { default $scheme; https https; }
    upstream web_backend { server web:3000; keepalive 16; }
    upstream api_v2_backend { server api-v2:4002; keepalive 16; }

    server {
        listen 80;
        server_name _;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        location = /health { access_log off; return 200 "healthy\n"; }

        location /socket.io/ {
            proxy_pass http://api_v2_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }
        location /api/v2/ {
            proxy_pass http://api_v2_backend;
            proxy_buffering off;
        }
        # Next owns /api/auth/*, /api/exchange and the remaining web routes.
        location / {
            proxy_pass http://web_backend;
        }
    }
}
