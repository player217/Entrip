# Docker Compose for Development with Prisma Support
# Includes workspace container for Windows Prisma binary issues

services:
  # Development workspace for Prisma generation (Windows fix)
  workspace:
    image: node:18-alpine
    container_name: entrip-workspace
    volumes:
      - .:/workspace
      - /workspace/node_modules
      - /workspace/.pnpm-store
    working_dir: /workspace
    command: tail -f /dev/null
    environment:
      - NODE_ENV=development
      - PRISMA_ENGINES_MIRROR=https://binaries.prisma.sh
      - DATABASE_URL=postgresql://entrip:entrip@postgres:5432/entrip
    networks:
      - entrip-net

  postgres:
    image: postgres:15-alpine
    container_name: entrip-postgres-local
    environment:
      POSTGRES_USER: entrip
      POSTGRES_PASSWORD: entrip
      POSTGRES_DB: entrip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entrip"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - entrip-net

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: entrip-redis-local
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - entrip-net

  # API v2 (New)
  api-v2:
    build:
      context: .
      dockerfile: packages/api/Dockerfile.dev
    image: entrip-api-v2
    container_name: entrip-api-v2-local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://entrip:entrip@postgres:5432/entrip
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      PORT: 4000
      JWT_SECRET: dev-secret-change-in-production-must-be-at-least-32-characters-long
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production-must-be-at-least-32-characters-long
      # FX (free providers) feature gate and tuning
      FX_ENABLE: "true"
      # Lower TTL in dev to tighten parity with internet baseline
      FX_TTL_SEC: 900
      FX_REQUIRED_SYMBOLS: USD,EUR,JPY,CNY
      # CORS allow-list (comma-separated)
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      # Optional: enable dev-only automatic db push/seed at container start
      # API_AUTO_DB_RESET: "true"
    ports:
      - "4002:4000"
    volumes:
      - ./packages/api:/app/packages/api
      - ./packages/shared:/app/packages/shared
      - ./packages/ui:/app/packages/ui
      - ./apps/web:/app/apps/web
      - /app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 4
    networks:
      - entrip-net

  # Free FX microservice (Option B)
  fx-free:
    build:
      context: ./apps/fx-free
      dockerfile: Dockerfile
    container_name: entrip-fx-free-local
    environment:
      FX_FREE_PORT: 4010
    ports:
      - "4010:4010"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4010/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - entrip-net

  # Crawler API service (Python FastAPI)
  crawler:
    build:
      context: ./apps/api-legacy/src/crawler
      dockerfile: Dockerfile.simple
    container_name: entrip-crawler-local
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - ./apps/api-legacy/src/crawler/korean_flight_schedules.json:/app/korean_flight_schedules.json:ro
    networks:
      - entrip-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    # image: entrip-web:dev  # Removed to prevent pull attempts
    container_name: entrip-web-local
    depends_on:
      api-v2:
        condition: service_healthy
      crawler:
        condition: service_healthy
    environment:
      # v2-only endpoints
      NEXT_PUBLIC_API_URL: http://localhost:4002
      NEXT_PUBLIC_WS_URL: ws://localhost:4002
      INTERNAL_API_URL: http://api-v2:4000
      INTERNAL_WS_URL: ws://api-v2:4000
      INTERNAL_API_V2_URL: http://api-v2:4000
      API_V2_URL: http://api-v2:4000
      NEXT_PUBLIC_CRAWLER_API_URL: http://crawler:8001
      # Switch dev defaults to v2 for testing
      NEXT_PUBLIC_BOOKING_API_MODE: v2
      NEXT_PUBLIC_TEAM_BOOKING_API_MODE: v2
      BOOKING_API_MODE: v2
      # Route /api/v2/bookings* to v2 internally
      TEAM_BOOKING_API_MODE: v2
      NODE_ENV: development
      MIGRATION_PHASE: 3
      API_MIGRATION_PHASE: 3
      # fx-free internal URL for fallback (Option B)
      INTERNAL_FX_FREE_URL: http://fx-free:4010
    ports:
      - "3000:3000"
    volumes:
      # Mount entire project for development
      - type: bind
        source: .
        target: /app
        consistency: cached

      # Web source mount (read-write, hot reload)
      - type: bind
        source: ./apps/web
        target: /app/apps/web
        consistency: cached

      # Packages mount for immediate updates
      - type: bind
        source: ./packages
        target: /app/packages
        consistency: cached

      # node_modules 蹂댄샇
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    networks:
      - entrip-net

networks:
  entrip-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:



