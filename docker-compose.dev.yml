# Docker Compose for Development with Prisma Support
# Includes workspace container for Windows Prisma binary issues

services:
  # Development workspace for Prisma generation (Windows fix)
  workspace:
    image: node:18-alpine
    container_name: entrip-workspace
    volumes:
      - .:/workspace
      - /workspace/node_modules
      - /workspace/.pnpm-store
    working_dir: /workspace
    command: tail -f /dev/null
    environment:
      - NODE_ENV=development
      - PRISMA_ENGINES_MIRROR=https://binaries.prisma.sh
      - DATABASE_URL=postgresql://entrip:entrip@postgres:5432/entrip
    networks:
      - entrip-net

  postgres:
    image: postgres:15-alpine
    container_name: entrip-postgres-local
    environment:
      POSTGRES_USER: entrip
      POSTGRES_PASSWORD: entrip
      POSTGRES_DB: entrip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entrip"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - entrip-net

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: entrip-redis-local
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - entrip-net

  # API v1 (Legacy)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    # image: entrip-api:dev  # Removed to prevent pull attempts
    container_name: entrip-api-local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://entrip:entrip@postgres:5432/entrip?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      PORT: 4000
      ENABLE_DEMO_ENDPOINTS: "true"
    ports:
      - "4001:4000"
    volumes:
      # 전체 프로젝트 읽기 전용으로 마운트 (루트 node_modules 포함)
      - type: bind
        source: .
        target: /app
        consistency: cached
        read_only: true

      # API 소스만 read-write 오버레이 (hot-reload 용)
      - type: bind
        source: ./apps/api
        target: /app/apps/api
        consistency: cached

      # 익명 볼륨으로 node_modules 보호
      - /app/node_modules
      - /app/apps/api/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 4
    networks:
      - entrip-net

  # API v2 (New)
  api-v2:
    build:
      context: .
      dockerfile: packages/api/Dockerfile.dev
    image: entrip-api-v2
    container_name: entrip-api-v2-local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://entrip:entrip@postgres:5432/entrip
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      PORT: 4000
      JWT_SECRET: dev-secret-change-in-production-must-be-at-least-32-characters-long
      # Optional: enable dev-only automatic db push/seed at container start
      # API_AUTO_DB_RESET: "true"
    ports:
      - "4002:4000"
    volumes:
      - ./packages/api:/app/packages/api
      - ./packages/shared:/app/packages/shared
      - ./packages/ui:/app/packages/ui
      - ./apps/web:/app/apps/web
      - /app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 4
    networks:
      - entrip-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    # image: entrip-web:dev  # Removed to prevent pull attempts
    container_name: entrip-web-local
    depends_on:
      api:
        condition: service_healthy
      api-v2:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4001
      NEXT_PUBLIC_WS_URL: ws://localhost:4001
      INTERNAL_API_URL: http://api:4000
      INTERNAL_WS_URL: ws://api:4000
      INTERNAL_API_V2_URL: http://api-v2:4000
      API_V2_URL: http://api-v2:4000
      # Switch dev defaults to v2
      NEXT_PUBLIC_BOOKING_API_MODE: v2
      NEXT_PUBLIC_TEAM_BOOKING_API_MODE: v2
      BOOKING_API_MODE: v2
      TEAM_BOOKING_API_MODE: v2
      NODE_ENV: development
      MIGRATION_PHASE: 2
    ports:
      - "3000:3000"
    volumes:
      # 전체 프로젝트 읽기 전용으로 마운트
      - type: bind
        source: .
        target: /app
        consistency: cached
        read_only: true

      # Web 소스만 read-write 오버레이 (hot-reload)
      - type: bind
        source: ./apps/web
        target: /app/apps/web
        consistency: cached

      # 패키지 소스도 마운트 (실시간 반영)
      - type: bind
        source: ./packages
        target: /app/packages
        consistency: cached

      # node_modules 보호
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    networks:
      - entrip-net

networks:
  entrip-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
