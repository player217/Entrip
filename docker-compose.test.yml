version: "3.8"

services:
  postgres-test:
    image: postgres:15-alpine
    container_name: entrip-postgres-test
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
      POSTGRES_DB: entrip_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d entrip_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

volumes:
  postgres_test_data: